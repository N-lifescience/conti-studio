<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>콘티 작업실</title>
  <meta name="description" content="수업 영상과 학생 활동 영상을 컷마다 눈으로 보며 고치고, AI에게 넘겨 완성하는 교사용 콘티 편집기">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='10' width='56' height='44' rx='8' fill='%231f5c4a'/%3E%3Crect x='12' y='18' width='18' height='12' rx='2' fill='%23fff'/%3E%3Crect x='34' y='18' width='18' height='12' rx='2' fill='%23fff'/%3E%3Crect x='12' y='34' width='18' height='12' rx='2' fill='%23fff'/%3E%3Crect x='34' y='34' width='18' height='12' rx='2' fill='%23f0b400'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="콘티 작업실">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="start-mode">
  <header class="top">
    <button id="home" class="brand" title="첫 화면으로">콘티 작업실</button>
    <span id="where" class="where"></span>
    <div class="pick">
      <select id="pick" aria-label="콘티 고르기"></select>
    </div>
    <span id="save" class="save" aria-live="polite"></span>
    <div class="tools">
      <button id="new" class="btn small">새 콘티</button>
      <button id="undo" class="btn small" title="되돌리기 (⌘Z / Ctrl+Z)" disabled>되돌리기</button>
      <a class="btn small" href="terms.html" target="_blank" rel="noopener">용어 사전</a>
      <button id="hist" class="btn small">지난 판</button>
      <button id="handoff" class="btn small primary">AI에게 넘기기</button>
    </div>
  </header>

  <main id="main">
    <p class="muted">불러오는 중…</p>
  </main>

  <div id="banner" class="banner hidden" role="status"></div>

  <dialog id="picker" aria-labelledby="picker-title">
    <div class="dlg-head">
      <h2 id="picker-title">그림 고르기</h2>
      <input id="picker-q" type="search" placeholder="파일 이름으로 찾기" aria-label="파일 이름으로 찾기">
      <button class="btn" data-close>닫기</button>
    </div>
    <div class="dlg-body">
      <p id="picker-hint" class="hint"></p>
      <div id="picker-grid" class="pgrid"></div>
    </div>
  </dialog>

  <dialog id="info" aria-labelledby="info-title">
    <div class="dlg-head">
      <h2 id="info-title"></h2>
      <button class="btn" data-close>닫기</button>
    </div>
    <div id="info-body" class="dlg-body"></div>
  </dialog>

  <script type="module" src="app.js?v=2"></script>
</body>
</html>
